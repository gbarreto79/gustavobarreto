name: Build Seguidores Tracker APK

on:
  push:
    branches:
      - claude/android-instagram-followers-tracker-y358v0
    paths:
      - "InstaFollowTracker/**"
      - ".github/workflows/build-instafollowtracker-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "InstaFollowTracker/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: InstaFollowTracker

      - name: Run unit tests
        run: ./gradlew test --stacktrace
        working-directory: InstaFollowTracker

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: InstaFollowTracker

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seguidores-tracker-debug-apk
          path: InstaFollowTracker/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
